<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Nunito; src: url(../intro/nunito.woff2) format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
  svg { display: block; font-family: Nunito, sans-serif; }
  .cap { letter-spacing: 0.32em; font-weight: 800; }
  .big { font-weight: 900; letter-spacing: -0.01em; }
</style>
</head>
<body>
<svg width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <filter id="sh" x="-20%" y="-50%" width="140%" height="200%"><feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/></filter>
    <filter id="glowF" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <radialGradient id="halo"><stop offset="0" stop-color="#8fb2a2" stop-opacity="0.55"/><stop offset="1" stop-color="#8fb2a2" stop-opacity="0"/></radialGradient>
    <linearGradient id="fadeL" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0.55"/><stop offset="0.6" stop-color="#000" stop-opacity="0"/></linearGradient>
  </defs>

  <!-- left-side shade for legible text over footage -->
  <rect id="shadeL" width="1920" height="1080" fill="url(#fadeL)" opacity="0"/>
  <rect id="shadeAll" width="1920" height="1080" fill="#000" opacity="0"/>

  <!-- A: pages -->
  <g id="A" filter="url(#sh)">
    <text id="aCap" x="160" y="330" class="cap" font-size="30" fill="#f4d774">EXAM SEASON</text>
    <text id="aPage" x="160" y="760" class="big" font-size="120" fill="#fbfaf6">PAGE 1</text>
    <text id="aOf" x="160" y="830" class="cap" font-size="34" fill="#e6e9e6">OF 64</text>
  </g>

  <!-- B: read reread highlight -->
  <g id="B" filter="url(#sh)">
    <text id="b1" x="160" y="440" class="big" font-size="110" fill="#fbfaf6">READ.</text>
    <text id="b2" x="160" y="570" class="big" font-size="110" fill="#fbfaf6">REREAD.</text>
    <rect id="bHl" x="150" y="618" width="0" height="96" rx="8" fill="#f4d774" opacity="0.92"/>
    <text id="b3" x="160" y="700" class="big" font-size="110" fill="#fbfaf6">HIGHLIGHT.</text>
  </g>

  <!-- C: exam day -->
  <g id="C" filter="url(#sh)">
    <text id="cCap" x="160" y="330" class="cap" font-size="30" fill="#d9a78a">EXAM DAY</text>
    <text id="cQ" x="160" y="760" class="big" font-size="120" fill="#fbfaf6">Did it stick?</text>
  </g>

  <!-- D: now with AI -->
  <g id="D" filter="url(#sh)">
    <text id="dCap" x="960" y="900" text-anchor="middle" class="cap" font-size="34" fill="#fbfaf6">NOW, IMAGINE USING AI</text>
  </g>

  <!-- E: AI essay card -->
  <g id="E">
    <g id="eCard" filter="url(#sh)">
      <rect x="1080" y="250" width="660" height="520" rx="34" fill="#14171a" fill-opacity="0.82" stroke="#ffffff" stroke-opacity="0.12"/>
      <rect x="1124" y="296" width="330" height="58" rx="22" fill="#2a343a"/>
      <text x="1150" y="335" font-size="28" font-weight="800" fill="#e6e9e6">Write my essay</text>
      <g id="eLines"></g>
      <rect id="eDoneBg" x="1450" y="690" width="250" height="52" rx="26" fill="#6f9282"/>
      <text id="eDone" x="1575" y="725" text-anchor="middle" font-size="26" font-weight="900" fill="#fbfaf6">✓ Done in 2.1s</text>
    </g>
  </g>

  <!-- F: did you learn it -->
  <g id="F" filter="url(#sh)">
    <text id="f1" x="160" y="760" class="big" font-size="104" fill="#fbfaf6">But did you</text>
    <text id="f2" x="160" y="880" class="big" font-size="104" fill="#f4d774">learn it?</text>
  </g>

  <!-- G: information ≠ understanding -->
  <g id="G">
    <text id="g1" x="960" y="420" text-anchor="middle" class="cap" font-size="64" fill="#e6e9e6" filter="url(#sh)">ACCESSING INFORMATION</text>
    <text id="gNe" x="960" y="610" text-anchor="middle" class="big" font-size="170" fill="#d9a78a" filter="url(#sh)">≠</text>
    <circle id="gHalo" cx="960" cy="760" r="320" fill="url(#halo)" opacity="0"/>
    <text id="g2" x="960" y="790" text-anchor="middle" class="cap" font-size="84" fill="#8fb2a2" filter="url(#sh)">UNDERSTANDING</text>
  </g>

  <!-- H: that's the problem -->
  <g id="H" filter="url(#sh)">
    <text id="hT" x="960" y="560" text-anchor="middle" class="big" font-size="140" fill="#fbfaf6">That's the problem.</text>
    <rect id="hLine" x="420" y="610" width="0" height="14" rx="7" fill="#d9a78a"/>
  </g>

  <!-- I: logo reveal -->
  <g id="I">
    <circle id="iHalo" cx="960" cy="400" r="380" fill="url(#halo)" opacity="0"/>
    <g id="iLogo">
      <circle r="120" fill="#6f9282"/>
      <path d="M-62 -18 Q-30 -36 0 -16 Q30 -36 62 -18 L62 46 Q30 28 0 48 Q-30 28 -62 46 Z" fill="#fbfaf6"/>
      <path d="M0 -16 L0 48" stroke="#6f9282" stroke-width="6"/>
      <path id="iSpark" d="M48 -66 L56 -48 L74 -42 L56 -36 L48 -18 L40 -36 L22 -42 L40 -48 Z" fill="#f4d774"/>
    </g>
    <text id="iBrand" x="960" y="660" text-anchor="middle" class="big" font-size="130" fill="#fbfaf6">Study <tspan fill="#8fb2a2">Pal</tspan></text>
    <g id="iPills" font-size="32" font-weight="800">
      <g class="pill"><rect x="470" y="730" width="300" height="68" rx="34" fill="none" stroke="#d9a78a" stroke-width="3"/><text x="620" y="775" text-anchor="middle" fill="#fbfaf6">Test first</text></g>
      <g class="pill"><rect x="810" y="730" width="300" height="68" rx="34" fill="none" stroke="#8fb2a2" stroke-width="3"/><text x="960" y="775" text-anchor="middle" fill="#fbfaf6">Teach the gaps</text></g>
      <g class="pill"><rect x="1150" y="730" width="300" height="68" rx="34" fill="none" stroke="#a3bccb" stroke-width="3"/><text x="1300" y="775" text-anchor="middle" fill="#fbfaf6">See your growth</text></g>
    </g>
  </g>

  <!-- phone transition -->
  <g id="phone" opacity="0">
    <rect x="-210" y="-430" width="420" height="860" rx="60" fill="#0d0f10"/>
    <rect x="-192" y="-412" width="384" height="824" rx="46" fill="#f1eee7"/>
    <rect x="-60" y="-398" width="120" height="22" rx="11" fill="#0d0f10"/>
    <text x="-150" y="-320" font-size="34" font-weight="900" fill="#2b302d">Study <tspan fill="#6f9282">Pal</tspan></text>
    <rect x="-150" y="-270" width="300" height="200" rx="26" fill="#dfe7e2"/>
    <rect x="-150" y="-50" width="140" height="160" rx="22" fill="#f1e3da"/>
    <rect x="10" y="-50" width="140" height="160" rx="22" fill="#e0e8ec"/>
    <rect x="-150" y="130" width="300" height="70" rx="22" fill="#6f9282"/>
  </g>

  <!-- letterbox bars (2.39:1), they open for the logo -->
  <rect id="barT" x="0" y="0" width="1920" height="138" fill="#000"/>
  <rect id="barB" x="0" y="942" width="1920" height="138" fill="#000"/>
  <!-- flash into the app -->
  <rect id="flash" width="1920" height="1080" fill="#f1eee7" opacity="0"/>
</svg>
<script>
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const out = (x) => 1 - Math.pow(1 - clamp(x), 3);
const back = (x) => { x = clamp(x); const c = 1.5; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const p = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = 0.35) => Math.min(ease(p(t, a, a + f)), 1 - ease(p(t, b - f, b)));
const op = (id, v) => $(id).setAttribute("opacity", v);
const tr = (id, s) => $(id).setAttribute("transform", s);
// a word that rises in
const rise = (id, t, a, b, f = 0.35) => { const k = out(p(t, a, a + 0.45)); op(id, Math.min(k, 1 - ease(p(t, b - f, b)))); tr(id, `translate(0 ${(1 - k) * 40})`); };

const lines = $("eLines");
for (let i = 0; i < 7; i++) {
  const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
  r.setAttribute("x", 1124); r.setAttribute("y", 390 + i * 40); r.setAttribute("height", 16); r.setAttribute("rx", 8); r.setAttribute("fill", "#8fb2a2");
  lines.appendChild(r);
}

function render(t) {
  // left shade under text-on-footage scenes
  op("shadeL", Math.max(win(t, 0.8, 9.1), win(t, 9.3, 13.8), win(t, 19.5, 22.3)));
  op("shadeAll", Math.max(win(t, 22.4, 30.3, 0.4) * 0.45, win(t, 30.4, 34.4, 0.3) * 0.35));

  // A
  op("A", win(t, 0.8, 5.5, 0.3));
  rise("aCap", t, 0.8, 5.5);
  rise("aPage", t, 1.6, 5.5); rise("aOf", t, 1.8, 5.5);
  $("aPage").textContent = "PAGE " + Math.max(1, Math.round(1 + 63 * ease(p(t, 1.8, 5.0))));

  // B
  op("B", 1);
  rise("b1", t, 5.75, 9.1); rise("b2", t, 6.35, 9.1); rise("b3", t, 7.0, 9.1);
  const hl = ease(p(t, 7.4, 8.1)) * (1 - ease(p(t, 8.8, 9.1)));
  $("bHl").setAttribute("width", 650 * hl);
  $("b3").setAttribute("fill", hl > 0.6 ? "#1b1d1c" : "#fbfaf6");

  // C
  rise("cCap", t, 9.4, 13.8); rise("cQ", t, 10.6, 13.8);
  tr("cQ", `translate(${Math.sin(t * 40) * 3 * win(t, 11.2, 12.0, 0.1)} ${(1 - out(p(t, 10.6, 11.05))) * 40})`);

  // D
  rise("dCap", t, 14.0, 16.2);

  // E
  const ec = out(p(t, 16.3, 16.8)) * (1 - ease(p(t, 19.2, 19.5)));
  op("E", ec); tr("eCard", `translate(${(1 - ec) * 120} 0)`);
  [...lines.children].forEach((r, i) => r.setAttribute("width", [560, 530, 570, 500, 550, 520, 300][i] * ease(p(t, 16.9 + i * 0.12, 17.1 + i * 0.12))));
  const dn = back(p(t, 17.9, 18.3));
  op("eDoneBg", clamp(dn)); op("eDone", clamp(dn));

  // F
  rise("f1", t, 19.6, 22.3); rise("f2", t, 20.0, 22.3);

  // G
  rise("g1", t, 22.8, 30.2);
  const ne = back(p(t, 24.9, 25.4));
  op("gNe", Math.min(clamp(ne * 2), 1 - ease(p(t, 29.9, 30.2))));
  tr("gNe", `translate(960 560) scale(${Math.max(0.01, ne)}) translate(-960 -560)`);
  rise("g2", t, 26.5, 30.2);
  op("gHalo", ease(p(t, 26.8, 27.8)) * (1 - ease(p(t, 29.9, 30.2))) * (0.8 + 0.2 * Math.sin(t * 3)));

  // H
  const hk = out(p(t, 30.5, 31.0));
  op("hT", Math.min(hk, 1 - ease(p(t, 34.1, 34.45))));
  tr("hT", `translate(960 540) scale(${0.92 + 0.08 * hk}) translate(-960 -540)`);
  $("hLine").setAttribute("width", 1080 * ease(p(t, 31.2, 32.0)) * (1 - ease(p(t, 34.1, 34.45))));

  // I (logo)
  const lg = back(p(t, 34.8, 35.6));
  op("I", 1 - ease(p(t, 42.6, 43.0)));
  tr("iLogo", `translate(960 ${400 + Math.sin(t * 1.5) * 6}) scale(${Math.max(0.001, lg)}) rotate(${(1 - clamp(lg)) * -50})`);
  op("iLogo", clamp(lg * 3) * (t > 34.6 ? 1 : 0));
  op("iHalo", ease(p(t, 35.2, 36.2)) * (0.75 + 0.25 * Math.sin(t * 2)));
  tr("iSpark", `rotate(${t * 40} 48 -42)`);
  const br = out(p(t, 35.6, 36.4));
  op("iBrand", br); tr("iBrand", `translate(0 ${(1 - br) * 34})`);
  [...document.querySelectorAll(".pill")].forEach((g, i) => {
    const k = back(p(t, 37.6 + i * 0.55, 38.2 + i * 0.55));
    g.setAttribute("opacity", clamp(k)); g.setAttribute("transform", `translate(0 ${(1 - clamp(k)) * 30})`);
  });

  // bars open as the logo arrives
  const bars = ease(p(t, 34.4, 35.4));
  $("barT").setAttribute("y", -138 * bars);
  $("barB").setAttribute("y", 942 + 138 * bars);

  // phone up, zoom, flash to the app's colour
  const ph = back(p(t, 42.8, 43.6));
  const zoom = ease(p(t, 44.2, 45.2));
  op("phone", clamp(ph * 3));
  tr("phone", `translate(960 ${540 + (1 - clamp(ph)) * 560}) scale(${0.95 + zoom * 1.7})`);
  op("flash", ease(p(t, 44.8, 45.35)));
}
window.render = render;
render(0);
</script>
</body>
</html>
