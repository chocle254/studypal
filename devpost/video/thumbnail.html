<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: Nunito; src: url(../intro/nunito.woff2) format("woff2"); font-weight: 200 1000; }
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#0f1214;font-family:Nunito,sans-serif}
.bg{position:absolute;inset:0;background:url(still.jpg) center/cover;filter:saturate(.8) contrast(1.08) brightness(.62)}
.fade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,12,13,.92) 0%,rgba(10,12,13,.75) 42%,rgba(10,12,13,.15) 75%,rgba(10,12,13,.55) 100%)}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 220px rgba(0,0,0,.75)}
.copy{position:absolute;left:64px;top:70px;width:700px;color:#fbfaf6}
.cap{font-weight:900;letter-spacing:.28em;font-size:24px;color:#f4d774}
h1{margin:14px 0 0;font-weight:1000;font-size:92px;line-height:.98;letter-spacing:-.02em;text-shadow:0 6px 24px rgba(0,0,0,.5)}
h1 span{color:#8fb2a2}
.score{margin-top:34px;display:flex;align-items:center;gap:18px}
.pill{font-weight:1000;font-size:64px;line-height:1;padding:14px 26px;border-radius:22px}
.before{background:rgba(255,255,255,.12);color:#cfd6d2}
.after{background:#6f9282;color:#fbfaf6;box-shadow:0 0 50px rgba(143,178,162,.55)}
.arrow{font-size:56px;font-weight:1000;color:#f4d774}
.brand{position:absolute;left:64px;bottom:46px;display:flex;align-items:center;gap:16px;color:#fbfaf6;font-weight:1000;font-size:44px}
.brand span{color:#8fb2a2}
.logo{width:62px;height:62px;border-radius:50%;background:#6f9282;display:grid;place-items:center}
.phone{position:absolute;right:92px;top:46px;width:300px;height:640px;border-radius:44px;background:#0b0d0e;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 90px rgba(143,178,162,.35);transform:rotate(4deg)}
.screen{width:100%;height:100%;border-radius:34px;background:url(phone.jpg) top center/100% auto no-repeat #f1eee7}
.tag{position:absolute;right:300px;top:560px;background:#f4d774;color:#1b1d1c;font-weight:1000;font-size:24px;padding:10px 18px;border-radius:14px;transform:rotate(-4deg);box-shadow:0 10px 30px rgba(0,0,0,.4)}
</style></head><body>
<div class="bg"></div><div class="fade"></div><div class="vig"></div>
<div class="copy">
  <div class="cap">AI STUDY PARTNER</div>
  <h1>Stop reading.<br><span>Start understanding.</span></h1>
  <div class="score"><div class="pill before">20%</div><div class="arrow">→</div><div class="pill after">57%</div></div>
</div>
<div class="brand"><div class="logo"><svg width="40" height="40" viewBox="-70 -70 140 140"><path d="M-62 -18 Q-30 -36 0 -16 Q30 -36 62 -18 L62 46 Q30 28 0 48 Q-30 28 -62 46 Z" fill="#fbfaf6"/><path d="M0 -16 L0 48" stroke="#6f9282" stroke-width="6"/><path d="M48 -66 L56 -48 L74 -42 L56 -36 L48 -18 L40 -36 L22 -42 L40 -48 Z" fill="#f4d774"/></svg></div>Study <span>Pal</span></div>
<div class="phone"><div class="screen"></div></div>
<div class="tag">Real results, real AI</div>
</body></html>
